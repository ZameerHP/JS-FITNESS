<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS FITNESS INC | 24/7 Gym &amp; Personal Training Calgary NE</title>
    <meta
      name="description"
      content="JS FITNESS INC — More than just a gym membership. 24/7 gym access, customized coaching, nutrition tracking, and real transformations in Calgary NE."
    />
    <meta name="theme-color" content="#050505" />
    <script>
      (function () {
        try {
          var q = /[?&]tier=(high|medium|low)\b/.exec(location.search);
          if (q) {
            document.documentElement.dataset.perf = q[1];
            return;
          }
          var t = matchMedia('(pointer: coarse)').matches || innerWidth < 768;
          var c = navigator.hardwareConcurrency || 4;
          var m = navigator.deviceMemory || 4;
          var r = matchMedia('(prefers-reduced-motion: reduce)').matches;
          var sw = true;
          try {
            var cv = document.createElement('canvas');
            var gl = cv.getContext('webgl', { failIfMajorPerformanceCaveat: true });
            if (gl) {
              var dbg = gl.getExtension('WEBGL_debug_renderer_info');
              var ren = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '') : '';
              sw = /SwiftShader|Software|llvmpipe|Microsoft Basic Render/i.test(ren);
              var lc = gl.getExtension('WEBGL_lose_context');
              if (lc) lc.loseContext();
            }
          } catch (e) {}
          document.documentElement.dataset.perf =
            r || c <= 2 || m <= 2
              ? 'low'
              : t || c <= 4 || m <= 4 || sw || navigator.webdriver
                ? 'medium'
                : 'high';
        } catch (e) {
          document.documentElement.dataset.perf = 'high';
        }
      })();
    </script>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/barlow-condensed-900-italic.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-400-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      href="/images/hero-athlete.webp"
      imagesrcset="/images/hero-athlete-480.webp 480w, /images/hero-athlete-700.webp 700w, /images/hero-athlete.webp 1100w"
      imagesizes="(max-width: 768px) 220px, 550px"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/hero-bg.webp"
      imagesrcset="/images/hero-bg-800.webp 800w, /images/hero-bg-1200.webp 1200w, /images/hero-bg.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="dns-prefetch" href="https://assets.calendly.com" />
  </head>
  <body class="bg-[#050505] text-white antialiased selection:bg-[#B6F500] selection:text-[#050505]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
